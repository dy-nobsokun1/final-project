<title id="t">UniSwap architecture</title>
<desc id="d">People use three ways in. The browser goes to the Next.js server on port 3000, which keeps the login cookie and calls the API. The iPhone app calls the API directly with a Bearer token. The Telegram app talks to Telegram's Bot API servers, and the API polls those servers. The Express API on port 4000 holds all the rules and reads and writes PostgreSQL on Supabase. The API calls out to Cloudinary, Stripe in test mode, Bakong KHQR, Gmail SMTP, Groq and Gemini. Nothing outside calls into the API.</desc>
